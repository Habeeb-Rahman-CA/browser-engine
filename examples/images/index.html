<!DOCTYPE html>
<html>
<head>
    <title>Images &amp; Content Demo</title>
    <style>
        body { font-family: ui-sans-serif, system-ui, sans-serif; background-color: #faf8f5; color: #48433e; margin: 0; padding: 30px; }
        .gallery { width: 560px; margin: 20px auto; background-color: #ffffff; padding: 32px; border: 1px solid #e8e3d8; border-radius: 20px; }
        .tag { display: inline-block; background-color: #eaf1f8; color: #58759b; border-radius: 12px; padding: 4px 12px; font-size: 13px; font-weight: 700; margin-bottom: 12px; }
        h1 { color: #38332d; font-size: 24px; margin: 6px 0 12px 0; }
        p { color: #7c756c; font-size: 15px; line-height: 1.6; }
        .placeholder { display: block; width: 440px; height: 140px; background-color: #f6f3ed; border: 2px dashed #ded7c9; border-radius: 16px; margin: 16px 0; padding: 16px; }
        .placeholder p { color: #948d82; font-weight: 700; text-align: center; }
        .btn-link { display: inline-block; margin-top: 16px; background-color: #f5f2eb; border: 1px solid #e5dfd4; border-radius: 18px; padding: 8px 18px; color: #5a544c; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="gallery">
        <span class="tag">Media Box Layout</span>
        <h1>Image &amp; Media Placeholders</h1>
        <p>Demonstrating visual container dimensions, rounded borders, and margins.</p>
        <div class="placeholder">
            <p>Rounded Image Box (440x140)</p>
        </div>
        <p><a href="../basic/index.html" class="btn-link">&larr; Back to Basic Demo</a></p>
    </div>
</body>
</html>
