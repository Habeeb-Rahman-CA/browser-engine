version: "3.8"

services:
  browser-engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: browser-engine:latest
    container_name: educational-browser-engine
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - BROWSER_PORT=8080
      - BROWSER_HOST=0.0.0.0
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

